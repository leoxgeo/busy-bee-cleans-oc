  <style>
    /* Full-screen booking: header + form only, the page itself never scrolls,
       so the form is the one and only scroll area. */
    html, body.booking-page { height: 100%; }
    body.booking-page {
      display: flex;
      flex-direction: column;
      height: 100vh;

      src="https://coastal-cubs-booking-114797236714.us-west2.run.app/book?embed=1&amp;source=busybee"
      title="Book your baby gear cleaning"
      loading="eager"></iframe>
  </main>

  <script src="./script.js"></script>

  <!-- Booking iframe: resize, scroll, and log completed bookings to GA4 -->
  <script>
    (function () {
      var BOOKING_ORIGIN = 'https://coastal-cubs-booking-114797236714.us-west2.run.app';
      var EVENT_NAME = 'baby_gear_cleaning_booking_completed';
      var SOURCE = 'busybee';
      var frame = document.getElementById('bb-booking-frame');
      var wrap = document.getElementById('bb-booking-wrap');
      var logged = {};

      frame.addEventListener('load', function () { wrap.classList.add('is-loaded'); });

      window.addEventListener('message', function (event) {
        if (event.origin !== BOOKING_ORIGIN || event.source !== frame.contentWindow) return;
        var data = event.data || {};

        // Frame is sized to the screen; ignore height/scroll messages.
        if (data.type === 'ccc-booking-height' || data.type === 'ccc-booking-scroll-top') return;

        if (data.type !== 'ccc-booking-completed' || data.eventName !== EVENT_NAME) return;
        if (data.source && data.source !== SOURCE) return;

        var bookingId = typeof data.bookingId === 'string' ? data.bookingId.trim() : '';
        if (!bookingId || logged[bookingId]) return;
        logged[bookingId] = true;

        var storageKey = 'bb-booking-completed:' + bookingId;
        try {
          if (sessionStorage.getItem(storageKey)) return;
          sessionStorage.setItem(storageKey, '1');
        } catch (e) {}

        var params = {
          booking_id: bookingId,
          booking_source: SOURCE,
          event_category: 'booking',
          event_label: 'Baby Gear Cleaning'
        };
        var value = Number(data.value);
        if (isFinite(value) && value > 0) {
          params.value = value;
          params.currency = typeof data.currency === 'string' ? data.currency : 'USD';
        }

        if (typeof gtag === 'function') gtag('event', EVENT_NAME, params);
        if (typeof clarity === 'function') clarity('event', EVENT_NAME);
      });
    })();
  </script>
